    <script>
      (function() {
        // Fix for extension and environment scripts attempting to assign window.fetch when it has only a getter
        try {
          var _rawFetch = window.fetch;
          var _currentFetch = _rawFetch ? _rawFetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Ignore if cannot redefine
        }

        // Prevent extension injected script errors from bubbling up as uncaught errors
        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event.message && event.message.indexOf('Cannot set property fetch') !== -1)
          ) {
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (
            event.reason &&
            event.reason.message &&
            event.reason.message.indexOf('Cannot set property fetch') !== -1
          ) {
            event.preventDefault();
          }
        });
      })();
    </script>
